name: Verify backend contracts and integrity
on:
  push:
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: afridict_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/afridict_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Enforce lint rules
        run: npm run lint
      - name: Run tests and enforce coverage
        run: npm run test:coverage
      - name: Build production artifacts
        run: npm run build
      - name: Verify generated OpenAPI contract
        run: npm run api:check
      - name: Lint OpenAPI contract
        run: npm run api:lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
